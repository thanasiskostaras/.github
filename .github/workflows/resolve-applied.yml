name: Resolve applied suggestions

# Reusable follow-up to claude-review.yml. Call it from any repo with:
#   uses: thanasiskostaras/.github/.github/workflows/resolve-applied.yml@<sha> # vX.Y.Z
#
# GitHub's native "Apply suggestion" button only commits the code — it does not
# comment, and it does not resolve the thread. Neither does an author who fixes
# the line by hand. So threads accumulate forever (see dotfiles#50).
#
# On every push to a PR this walks the UNRESOLVED review threads, and for each
# one carrying a ```suggestion block checks whether that code is now actually
# present in the file. If it is, it replies with the commit and resolves the
# thread. If it is not, the thread is LEFT OPEN — an un-addressed concern must
# never be auto-resolved, so prose-only findings are always left to a human.
on:
  workflow_call:
    inputs:
      bot_login:
        description: Login whose review threads should be considered.
        type: string
        required: false
        default: github-actions

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # GitHub forces GITHUB_TOKEN to read-only for pull_request events from a
      # FORK, regardless of the permissions: block above — so resolveReviewThread
      # would fail. Skip loudly rather than fail silently. Supporting forks would
      # need pull_request_target, which we deliberately avoid here: it runs with
      # a writable token against untrusted head code.
      - name: Skip on fork PRs (read-only token)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Fork PR — GITHUB_TOKEN is read-only, so threads cannot be resolved. Skipping."
          exit 0

      - uses: actions/checkout@v7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve threads whose suggestion is now present
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOT_LOGIN: ${{ inputs.bot_login }}
        run: |
          cat > /tmp/resolve_applied.py <<'PYEOF'
          import json, os, re, subprocess, sys

          OWNER, REPO = os.environ["OWNER"], os.environ["REPO"]
          PR, HEAD_SHA = int(os.environ["PR"]), os.environ["HEAD_SHA"]
          BOT = os.environ["BOT_LOGIN"]

          def gh(args, **kw):
              return subprocess.run(["gh"] + args, capture_output=True, text=True, check=True, **kw).stdout

          Q = """
          query($owner:String!,$repo:String!,$pr:Int!){
            repository(owner:$owner,name:$repo){ pullRequest(number:$pr){
              reviewThreads(first:100){ nodes{
                id isResolved path
                comments(first:1){ nodes{ body author{ login } } } } } } } }
          """
          data = json.loads(gh(["api","graphql","-f","query="+Q,"-F","owner="+OWNER,
                                "-F","repo="+REPO,"-F","pr=%d"%PR]))
          threads = data["data"]["repository"]["pullRequest"]["reviewThreads"]["nodes"]

          SUGGESTION = re.compile(r"```suggestion\r?\n(.*?)```", re.S)

          def norm(text):
              # Compare on content, not indentation/EOL noise.
              return "\n".join(l.rstrip() for l in text.replace("\r\n","\n").split("\n") if l.strip())

          resolved = skipped = 0
          for t in threads:
              if t["isResolved"] or not t["comments"]["nodes"]:
                  continue
              c = t["comments"]["nodes"][0]
              if (c.get("author") or {}).get("login") != BOT:
                  continue
              m = SUGGESTION.search(c["body"] or "")
              if not m:
                  print("skip (no suggestion block): %s" % t["path"]); skipped += 1; continue
              want = norm(m.group(1))
              if not want:
                  skipped += 1; continue
              try:
                  with open(t["path"], encoding="utf-8") as fh:
                      have = norm(fh.read())
              except OSError as e:
                  print("skip (unreadable %s): %s" % (t["path"], e)); skipped += 1; continue
              if want not in have:
                  print("leave open (not applied): %s" % t["path"]); skipped += 1; continue

              body = ("Applied in `%s` — the suggested change is present in `%s`, "
                      "so this thread is resolved automatically.") % (HEAD_SHA[:7], t["path"])
              R = ("mutation($id:ID!,$body:String!){"
                   "addPullRequestReviewThreadReply(input:{pullRequestReviewThreadId:$id,body:$body}){clientMutationId}}")
              S = "mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{id}}}"
              try:
                  gh(["api","graphql","-f","query="+R,"-F","id="+t["id"],"-F","body="+body])
                  gh(["api","graphql","-f","query="+S,"-F","id="+t["id"]])
                  print("resolved: %s" % t["path"]); resolved += 1
              except subprocess.CalledProcessError as e:
                  print("FAILED to resolve %s: %s" % (t["path"], e.stderr), file=sys.stderr)

          print("\nresolved=%d left-open=%d" % (resolved, skipped))

          PYEOF
          python3 /tmp/resolve_applied.py
